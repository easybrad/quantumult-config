# 日常更新：更新分流资源即可；完整模板仅供首次初始化，不要反复覆盖设备配置。
# 使用说明：这是完整配置模板，不是单个分流列表。
# 导入后需添加个人节点订阅，更新远程规则，启用规则分流模式。
# 配置名称: Quantumult X 完整分流（ChinaMax / Global / Advertising）
# 生成日期: 2026-09-13
# GitHub发布模板：不含个人节点订阅密钥和证书；指定修正规则由 custom.list 订阅管理。
# 组合说明：ChinaMax 包含 China/ChinaIPs/ChinaMedia；Global 包含 Proxy；Advertising 包含 Privacy/Hijacking。
# 不重复添加这些已包含的子规则；Direct 作为去广告放行例外先于 Advertising。
# 已比较各分类：广告使用正式汇总版，国外使用 Global 加 GlobalMedia，OpenAI 使用专用规则。
# 导入后使用规则分流模式；代理出口选 proxy 跟随主界面手动节点，或选“自动选择”。
# 远程规则 update-interval=86400：按24小时更新间隔检查；需网络可访问资源。
# 节点订阅在设备上自行添加；配置结构不会随规则更新自动改变。
# 国内和局域网直连；广告拒绝；国外及未匹配流量使用代理出口。

[general]
# 服务检查超时：放宽至5秒，减少暂时延迟造成的超时
server_check_timeout = 5000

# 直连网络测试
network_check_url = http://taobao.com/

# 代理策略测试
server_check_url = http://cp.cloudflare.com/generate_204

# 配置文件图标
profile_img_url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Quantumult_X.png

# 地理位置检查
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js

# 自定义解析器
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

# 排除线路
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32

# DNS排除列表
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com

# UDP回退策略
fallback_udp_policy = reject

# UDP丢弃列表
udp_drop_list = QUIC



[dns]
# 禁用IPv6 DNS应答；保留原有系统DNS参与及自定义DNS设置
no-ipv6

# 常规 DNS 服务器
server = 223.5.5.5
server = 119.29.29.29



[policy]
# 统一代理入口：proxy 使用 Quan 主界面节点列表中选中的节点。
# 手动模式在“代理出口”中选 proxy；自动模式选“自动选择”。
static = 代理出口, proxy, 自动选择

# 根据测试网址延迟自动选节点；活跃时按10分钟间隔检查。
# 自动模式使用此组的测速结果，不跟随主界面的手动节点选择。
# 测试延迟不代表实际下载速度或流媒体解锁能力。
url-latency-benchmark = 自动选择, server-tag-regex=^, check-interval=600, tolerance=50, alive-checking=false

[server_local]
# 在设备上添加自己的节点或节点订阅。

[server_remote]
# 在 Quantumult X 的节点订阅界面添加自己的订阅。
# 此公开模板不包含个人节点订阅地址。

[filter_local]
# 在此按需添加自己的域名例外。
# 全部未匹配流量使用统一代理出口。
final, 代理出口

[filter_remote]
# 自定义修正优先应用，独立更新，不覆盖证书和节点；保持逐条规则的策略。
https://raw.githubusercontent.com/easybrad/quantumult-config/main/custom.list, tag=自定义修正, inserted-resource=true, update-interval=3600, opt-parser=false, enabled=true

# 局域网直连
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Lan/Lan.list, tag=局域网, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

# OpenAI及依赖服务：使用独立订阅明确出口，优先于通用放行/广告列表。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI代理, force-policy=代理出口, update-interval=86400, opt-parser=false, enabled=true

# 去广告放行例外：按上游 Direct 说明置于 Advertising 之前。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Direct/Direct.list, tag=去广告放行, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

# 广告拒绝
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Advertising/Advertising.list, tag=广告拦截, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true

# 国外媒体与服务使用统一代理，不另设媒体策略组
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GlobalMedia/GlobalMedia.list, tag=国外媒体与服务, force-policy=代理出口, update-interval=86400, opt-parser=false, enabled=true

# 普通苹果服务直连；前面的国外媒体规则先匹配其例外
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=苹果直连, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

# 国外网站使用统一代理
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Global/Global.list, tag=国外代理, force-policy=代理出口, update-interval=86400, opt-parser=false, enabled=true

# 国内域名和IP合集，置于具体服务规则之后
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMax/ChinaMax.list, tag=国内直连, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

[rewrite_local]
# 本地重写

[rewrite_remote]
# 远程重写

[task_local]
# 媒体解锁查询
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=媒体解锁查询, img-url=play.circle.system, enabled=true

# 节点送中查询
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/switch-check-google.js, tag=节点送中查询, img-url=drop.circle.system, enabled=true

# 网络信息查询
event-interaction https://raw.githubusercontent.com/xream/scripts/main/surge/modules/network-info/net-lsp-x.js, tag=网络信息查询, img-url=link.circle.system, enabled=true

[http_backend]
# HTTPBackend

[mitm]
# 当前模板没有启用重写资源，无需附带个人证书。
skip_validating_cert = false
hostname = -buy.itunes.apple.com

