# Shadowrocket 分流模板：保留主页中的个人节点订阅，手动选择节点。
# 导入：配置 -> 添加配置 URL -> 下载并使用；全局路由选择“配置”。
# PROXY 使用主页手动选择的代理节点，不创建自动测速或负载均衡组。
# 上游规则通过 RULE-SET / DOMAIN-SET 远程引用，更新由 Shadowrocket 客户端管理。
# 规则集更新不等于本模板更新；下方内联自定义例外修改后需重新下载模板。
# 不包含节点密码、证书或 HTTPS 解密配置。
# 来源：https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Shadowrocket

[General]
dns-server = system

[Proxy Group]
苹果服务 = select,DIRECT,PROXY
广告拦截 = select,REJECT,DIRECT

[Rule]
# 自定义修正：与 Quan custom.list / Clash custom-*.yaml 同步维护。
DOMAIN,msmp.abchina.com.cn,REJECT
DOMAIN-SUFFIX,123ths.com,DIRECT
DOMAIN-SUFFIX,10jqka.com.cn,DIRECT
DOMAIN-SUFFIX,hexin.cn,DIRECT

# Lan
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT

# OpenAI
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,PROXY

# Direct
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Direct/Direct.list,DIRECT

# Advertising
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising_Domain.list,广告拦截
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,广告拦截

# GlobalMedia
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia_Domain.list,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia.list,PROXY

# Apple
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,苹果服务

# Global
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global_Domain.list,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global.list,PROXY

# ChinaMax
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT

# 未匹配流量直连
FINAL,DIRECT
